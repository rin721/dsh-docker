services:
  edge:
    image: "caddy:${EDGE_CADDY_VERSION:-2.11.4}"
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    environment:
      DSH_DOMAIN: "${DSH_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL}"
    ports:
      - "${EDGE_BIND_ADDRESS:-0.0.0.0}:${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_BIND_ADDRESS:-0.0.0.0}:${EDGE_HTTPS_PORT:-443}:443"
      - "${EDGE_BIND_ADDRESS:-0.0.0.0}:${EDGE_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile.edge:/etc/caddy/Caddyfile:ro
      - type: bind
        source: "${RUNTIME_DIR:-./.runtime}/edge/caddy/data"
        target: /data
      - type: bind
        source: "${RUNTIME_DIR:-./.runtime}/edge/caddy/config"
        target: /config
    networks:
      - backend
