name: deepseek-harness

services:
  dsh:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DSH_VERSION: "${DSH_VERSION:-latest}"
        INSTALL_GO_DEV_TOOLS: "true"
    image: local/deepseek-harness-dev:latest
    container_name: deepseek-harness
    restart: unless-stopped
    working_dir: /workspace
    environment:
      DSH_HOME: /home/node/.dsh
      DSH_PERMISSION_MODE: workspace-write
      DSH_TELEMETRY_DISABLED: "1"
      NODE_USE_ENV_PROXY: "1"
      DSH_EXTRA_TRUSTED_HOSTS: "${DSH_DOMAIN},${DSH_DOMAIN}:443"
    volumes:
      - type: bind
        source: /var/lib/.dsh/data
        target: /workspace
      - type: bind
        source: /var/lib/.dsh/home
        target: /home/node/.dsh
    expose:
      - "3080"
    networks:
      - app
    stdin_open: true
    tty: true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  tinyauth:
    image: ghcr.io/tinyauthapp/tinyauth:v5.1.3
    container_name: dsh-tinyauth
    restart: unless-stopped
    environment:
      TINYAUTH_CONFIGFILE: /config/tinyauth.yml
      TINYAUTH_APPURL: "https://${AUTH_DOMAIN}"
      TINYAUTH_LABELPROVIDER: none
      TINYAUTH_DATABASE_DRIVER: sqlite
      TINYAUTH_DATABASE_PATH: /data/tinyauth.db
      TINYAUTH_AUTH_SECURECOOKIE: "true"
      TINYAUTH_AUTH_SESSIONEXPIRY: "${TINYAUTH_SESSION_EXPIRY:-86400}"
      TINYAUTH_AUTH_LOGINMAXRETRIES: "3"
      TINYAUTH_AUTH_TRUSTEDPROXIES: "172.30.20.0/24"
      TINYAUTH_ANALYTICS_ENABLED: "false"
      TINYAUTH_UI_TITLE: "DeepSeek Harness"
    volumes:
      - ./auth/tinyauth.yml:/config/tinyauth.yml:ro
      - type: bind
        source: /var/lib/.dsh/tinyauth
        target: /data
    expose:
      - "3000"
    networks:
      - auth

  caddy:
    image: caddy:2.11.4
    container_name: dsh-caddy
    restart: unless-stopped
    depends_on:
      dsh:
        condition: service_healthy
      tinyauth:
        condition: service_healthy
    environment:
      DSH_DOMAIN: "${DSH_DOMAIN}"
      AUTH_DOMAIN: "${AUTH_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: /var/lib/.dsh/caddy/data
        target: /data
      - type: bind
        source: /var/lib/.dsh/caddy/config
        target: /config
    networks:
      - auth
      - app

networks:
  auth:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.20.0/24
  app:
    driver: bridge
