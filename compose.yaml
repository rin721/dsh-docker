services:
  dsh:
    image: "${DSH_IMAGE:-ghcr.io/rin721/dsh-docker:latest}"
    restart: unless-stopped
    working_dir: /workspace
    environment:
      DSH_HOME: /home/node/.dsh
      DSH_PERMISSION_MODE: "${DSH_PERMISSION_MODE:-workspace-write}"
      DSH_TELEMETRY_DISABLED: "${DSH_TELEMETRY_DISABLED:-1}"
      DSH_HTTP_COMPAT_SHIM: "${DSH_HTTP_COMPAT_SHIM:-true}"
      NODE_USE_ENV_PROXY: "${NODE_USE_ENV_PROXY:-1}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,dsh,gateway}"
    volumes:
      - type: bind
        source: "${RUNTIME_DIR:-./.runtime}/workspace"
        target: /workspace
      - type: bind
        source: "${RUNTIME_DIR:-./.runtime}/dsh-home"
        target: /home/node/.dsh
      # Runtime bridge files are mounted from the repository so proxy/security
      # fixes do not require rebuilding the heavy development image.
      - type: bind
        source: ./start-dsh-web.sh
        target: /usr/local/bin/start-dsh-web
        read_only: true
      - type: bind
        source: ./dsh-web-proxy.mjs
        target: /usr/local/lib/dsh-web-proxy.mjs
        read_only: true
      - type: bind
        source: ./dsh-http-compat.js
        target: /usr/local/lib/dsh-http-compat.js
        read_only: true
    expose:
      - "3080"
    networks:
      - backend
    stdin_open: true
    tty: true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    image: "caddy:${GATEWAY_CADDY_VERSION:-2.11.4}"
    restart: unless-stopped
    depends_on:
      dsh:
        condition: service_healthy
    environment:
      AUTH_REALM: "${AUTH_REALM:-DeepSeek Harness}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DSH_PORT:-3080}:3080"
    volumes:
      - ./Caddyfile.gateway:/etc/caddy/Caddyfile:ro
      - type: bind
        source: "${RUNTIME_DIR:-./.runtime}/auth/users.caddy"
        target: /etc/caddy/auth/users.caddy
        read_only: true
    networks:
      - backend

networks:
  backend:
    driver: bridge
