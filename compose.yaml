name: deepseek-harness

services:
  dsh:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "24.19.0"
        GO_VERSION: "1.26.6"
        RUST_TOOLCHAIN: "stable"
        PNPM_VERSION: "11.7.0"
        DSH_VERSION: "latest"
        INSTALL_GO_DEV_TOOLS: "true"
    image: local/deepseek-harness-dev:latest
    container_name: deepseek-harness
    restart: unless-stopped
    working_dir: /workspace
    environment:
      DSH_HOME: /home/node/.dsh
      DSH_PERMISSION_MODE: workspace-write
      DSH_TELEMETRY_DISABLED: "1"
      NODE_USE_ENV_PROXY: "1"

      # 可选代理；按实际情况取消注释。
      # HTTP_PROXY: http://host.docker.internal:7890
      # HTTPS_PROXY: http://host.docker.internal:7890
      # NO_PROXY: localhost,127.0.0.1

      # API Key 可在 Web UI 的 Settings -> Models 中保存。
      # 也可在这里传入，但环境变量会覆盖 Web UI 中保存的同名凭据。
      # DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      # DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}

    volumes:
      # 你的项目与工作文件：宿主机 -> 容器工作目录。
      - type: bind
        source: /var/lib/.dsh/data
        target: /workspace

      # DSH 配置、凭据、插件、会话等持久化数据。
      - type: bind
        source: /var/lib/.dsh/home
        target: /home/node/.dsh

    # 只发布到宿主机回环地址，禁止直接暴露到 0.0.0.0。
    ports:
      - "127.0.0.1:3080:3080"

    stdin_open: true
    tty: true
    stop_grace_period: 15s

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
