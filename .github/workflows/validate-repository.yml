name: Validate Repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate executable modes
        shell: bash
        run: |
          set -Eeuo pipefail
          failed=0

          while IFS= read -r file; do
            mode="$(git ls-files -s -- "$file" | awk 'NR == 1 { print $1 }')"
            if [[ "$mode" != "100755" ]]; then
              echo "::error file=${file}::Git mode is ${mode}; expected 100755"
              failed=1
            fi
          done < <(
            {
              printf '%s\n' start-dsh-web.sh
              find scripts -maxdepth 1 -type f -name '*.sh' -print
            } | sort
          )

          (( failed == 0 ))

      - name: Static self-test
        shell: bash
        run: bash scripts/self-test.sh
